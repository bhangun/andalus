# Andalus Agent Runner — headless CI/CD runner for Andalus agents
quarkus.banner.enabled=false
quarkus.log.level=WARN

# Disable HTTP server — this is a pure CLI application
quarkus.http.port=-1
# Point Picocli at the AndalusAgentRunner command class
quarkus.picocli.top-command=tech.kayys.andalus.runner.AndalusAgentRunner

# Disable datasource unless explicitly configured by the user
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:andalus_runner;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
